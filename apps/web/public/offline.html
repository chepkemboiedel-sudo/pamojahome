<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6D28D9">
  <title>Offline · PamojaHome</title>
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1e1b3a; background: #fff; text-align: center; }
    img { width: 88px; height: 88px; }
    h1 { font-size: 1.35rem; margin: 20px 0 8px; }
    p { color: #5b5675; margin: 0 0 24px; line-height: 1.5; }
    button { background: #6d28d9; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>PamojaHome needs a connection to load your household.<br>Check your signal and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
